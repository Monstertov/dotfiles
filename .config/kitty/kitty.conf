# Monstertov - https://tov.monster/
# monstertov glass: kitty
font_family      JetBrainsMono Nerd Font
font_size        11
background_opacity 0.72
window_padding_width 10
confirm_os_window_close 0
enable_audio_bell no

foreground #ffffff
background #141414
selection_background #0071bc
selection_foreground #ffffff
cursor #65b9f0
url_color #b4dafa

# black red green yellow blue magenta cyan white
color0  #1c1c1c
color8  #a8a8a8
color1  #e06c75
color9  #e88a92
color2  #5fb878
color10 #7fd197
color3  #e5c07b
color11 #f0d49e
color4  #0071bc
color12 #b4dafa
color5  #a06cd5
color13 #c19be6
color6  #65b9f0
color14 #b4dafa
color7  #d0d0d0
color15 #ffffff

# left drag copies, right click pastes (shift+right inside mouse-grabbing apps)
copy_on_select clipboard
mouse_map right press ungrabbed paste_from_clipboard
mouse_map shift+right press grabbed,ungrabbed paste_from_clipboard

# ctrl +/- to change text size, ctrl+0 to reset
map ctrl+equal change_font_size all +1.0
map ctrl+plus  change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0     change_font_size all 0
