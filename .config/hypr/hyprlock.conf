# Monstertov - https://tov.monster/
# monstertov glass: lock screen

general {
    hide_cursor = true
}

auth {
    fingerprint:enabled = true
}

background {
    monitor =
    path = ~/.local/share/wallpapers/glass.jpg
    blur_passes = 3
    blur_size = 8
    brightness = 0.7
}

label {
    monitor =
    text = $TIME
    color = rgba(ffffffee)
    font_size = 96
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A %d %B"
    color = rgba(65b9f0ff)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 60
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 54
    rounding = 14
    outline_thickness = 2
    outer_color = rgba(65b9f0ff) rgba(0071bcff) 45deg
    inner_color = rgba(14141499)
    font_color = rgba(ffffffff)
    check_color = rgba(b4dafaff)
    fail_color = rgba(e06c75ff)
    placeholder_text = <span foreground="##b4b4b4">password or fingerprint</span>
    fade_on_empty = false
    dots_center = true
    position = 0, -60
    halign = center
    valign = center
}
