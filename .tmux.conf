# install: curl -fLo ~/.tmux.conf https://raw.githubusercontent.com/Monstertov/dotfiles/main/.tmux.conf
# deps: sudo apt install -y xclip wl-clipboard

# Custom settings:

# default shell: zsh when it is installed, otherwise tmux's default (a missing shell kills every new pane)
if-shell 'test -x /usr/bin/zsh' 'set-option -g default-shell /usr/bin/zsh'

# remap prefix from 'C-b' to 'C-a' Only for user machines
#unbind C-b
#set-option -g prefix C-a
#bind-key C-a send-prefix

# split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# reload config file (change file location to your the tmux.conf you want to use)
bind r source-file ~/.tmux.conf

# Enable mouse control
set -g mouse on

# Disable right-click context menu, restore right-click paste
unbind-key -T root MouseDown3Pane
bind-key -T root MouseDown3Pane run "tmux set-buffer \"$(xclip -o -selection clipboard 2>/dev/null || wl-paste 2>/dev/null)\" && tmux paste-buffer"

# don't rename windows automatically
set-option -g allow-rename off

# color
set -g default-terminal "screen-256color"
set -as terminal-features ",*:RGB"

# Status bar — cyan accent (matches zsh theme)
set -g status-style bg=colour234,fg=white
set -g status-left "#[fg=cyan,bold] #S #[fg=white]| "
# CPU is sampled over 1 s from /proc/stat, RAM is used (total - available) from /proc/meminfo. Linux only.
# tmux expands % in this string, so the awk printf uses %%d.
set -g status-interval 5
set -g status-right-length 80
set -g status-right '#[fg=cyan]CPU #[fg=white]#((head -n1 /proc/stat; sleep 1; head -n1 /proc/stat) | awk "NR==1{t=\$2+\$3+\$4+\$5+\$6+\$7+\$8;i=\$5+\$6} NR==2{T=\$2+\$3+\$4+\$5+\$6+\$7+\$8;I=\$5+\$6;if(T>t)printf \"%%d\",100*((T-t)-(I-i))/(T-t)}")%% #[fg=white]| #[fg=cyan]RAM #[fg=white]#(awk "/MemTotal/{t=\$2}/MemAvailable/{a=\$2}END{printf \"%%d\",100*(t-a)/t}" /proc/meminfo)%% #[fg=white]| #[fg=cyan]%H:%M #[fg=white]| #[fg=cyan]%d %b'
set -g status-left-length 30
set -g window-status-format "#[fg=colour245] #I:#W "
set -g window-status-current-format "#[fg=cyan,bold] #I:#W "
set -g pane-border-style fg="#0071bc"
set -g pane-active-border-style fg=cyan
set -g window-style "bg=#141414"
set -g window-active-style "bg=#202020"

# Standard inverted selection highlight (no yellow)
set -wg mode-style bg=white,fg=black

# Vi copy mode
setw -g mode-keys vi

# OSC 52 clipboard support (works over SSH)
set -g set-clipboard on

# Pass clickable links (OSC 8, e.g. the Claude Code status line) through to the outer terminal.
# Needs tmux 3.4+; older tmux accepts the line and ignores it.
set -as terminal-features ",*:hyperlinks"

# Copy to local clipboard via OSC 52 on mouse drag or 'y' key
bind -T copy-mode-vi y send -X copy-pipe-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard 2>/dev/null || wl-copy"
bind -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard 2>/dev/null || wl-copy"

# Give escape sequences (e.g. OSC 11 color replies over SSH) time to arrive whole,
# otherwise they leak into the shell as "^[]11;rgb:..." garbage
set -sg escape-time 100
